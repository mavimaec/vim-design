[package]
name = "vim-design-ffi"
description = "C ABI layer over vim-design-lib (cdylib + staticlib). Skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "vim_design"
crate-type = ["cdylib", "staticlib"]

[dependencies]
vim-design-lib = { workspace = true }

[build-dependencies]
cbindgen = "0.29"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
