[package]
name = "vim-design-test"
description = "VimDesignTest: integration & regression tests for vim-design-lib."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
vim-design-lib = { workspace = true, features = ["json-debug"] }

[dev-dependencies]
# Property tests only (docs/ARCHITECTURE.md §12). Dev-dependency of this
# native-only test crate: it never appears in wasm builds of the library.
proptest = "1"
serde = { workspace = true }
postcard = { workspace = true }
serde_json = { workspace = true }
