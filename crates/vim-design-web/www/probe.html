<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VIM Design — WASM Threading Probe</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0d1117; color: #e6edf3; }
    h1 { font-size: 1.3rem; }
    table { border-collapse: collapse; margin: 1rem 0; }
    td, th { border: 1px solid #30363d; padding: 0.4rem 0.8rem; text-align: left; }
    #verdict { font-size: 2rem; font-weight: bold; padding: 0.5rem 0; }
    #verdict.pass { color: #3fb950; }
    #verdict.fail { color: #f85149; }
    canvas { border: 1px solid #30363d; display: block; margin-top: 1rem; }
    #status { color: #8b949e; }
  </style>
</head>
<body>
  <h1>VIM Design — WASM Threading Probe</h1>
  <p id="status">loading…</p>
  <div id="verdict"></div>
  <table id="results-table">
    <tbody id="results"></tbody>
  </table>
  <canvas id="view" width="640" height="240"></canvas>
  <script type="module" src="./probe.js"></script>
</body>
</html>
