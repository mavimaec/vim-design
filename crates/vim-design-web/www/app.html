<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef0f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="VIM Design — author building elements in the browser." />
  <title>VIM Design</title>
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M6 15l10-6 10 6-10 6z' fill='white'/%3E%3Cpath d='M6 19l10 6 10-6' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <main id="stage">
    <canvas id="view" aria-label="3D model view"></canvas>
    <canvas id="hud" aria-hidden="true"></canvas>
  </main>

  <header id="topbar">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="#2f6fed"/><path d="M6 15l10-6 10 6-10 6z" fill="#fff"/><path d="M6 19l10 6 10-6" fill="none" stroke="#fff" stroke-width="2"/></svg>
      <span>VIM Design</span>
    </div>
    <button id="level-chip" class="chip" type="button" aria-haspopup="listbox" title="Active level">
      <span class="swatch"></span>
      <span class="chip-text"><span class="chip-name">—</span><span class="chip-elev"></span></span>
      <svg class="ico sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="seg" id="view-toggle" role="tablist" aria-label="View">
      <button type="button" data-view="plan" role="tab">Plan</button>
      <button type="button" data-view="3d" role="tab">3D</button>
    </div>
    <div class="spacer"></div>
    <button id="tree-btn" class="icon-btn" type="button" title="Model: levels and elements" aria-label="Model tree" aria-pressed="false">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 4.5h6M5 4.5v15M5 12h4.5M5 19.5h4.5"/><rect x="11.5" y="2.5" width="8" height="4" rx="1.2"/><rect x="11.5" y="10" width="8" height="4" rx="1.2"/><rect x="11.5" y="17.5" width="8" height="4" rx="1.2"/></svg>
    </button>
    <button id="undo" class="icon-btn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
    </button>
    <button id="redo" class="icon-btn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
    </button>
    <button id="menu-btn" class="icon-btn" type="button" title="Menu" aria-label="Menu">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <header id="edit-bar" hidden aria-label="Edit Mode">
    <button id="edit-cancel" class="edit-btn cancel" type="button" title="Cancel editing — discard changes" aria-label="Cancel editing">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="edit-title">
      <span class="edit-caption">Editing</span>
      <span id="edit-name" class="edit-name"></span>
    </div>
    <div class="seg dark" id="edit-view-toggle" role="tablist" aria-label="View">
      <button type="button" data-view="plan" role="tab">Plan</button>
      <button type="button" data-view="3d" role="tab">3D</button>
    </div>
    <button id="edit-undo" class="icon-btn on-dark" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
    </button>
    <button id="edit-redo" class="icon-btn on-dark" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
    </button>
    <button id="edit-confirm" class="edit-btn confirm" type="button" title="Done — keep changes (Enter)" aria-label="Done editing">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
  </header>

  <nav id="edit-dock" hidden aria-label="Edit tools">
    <div class="dock-group" role="tablist" aria-label="Select">
      <button class="tool" type="button" data-edit-mode="points" title="Select points (1)">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 17L9 6l10 4" class="thin"/><circle cx="5" cy="17" r="2.4" class="fill"/><circle cx="9" cy="6" r="2.4" class="fill"/><circle cx="19" cy="10" r="2.4" class="fill"/></svg>
        <span>Points</span>
      </button>
      <button class="tool" type="button" data-edit-mode="edges" title="Select edges (2)">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 18L10 5l10 5"/><path d="M10 5l10 5" stroke-width="3.2"/></svg>
        <span>Edges</span>
      </button>
      <button class="tool" type="button" data-edit-mode="faces" title="Select faces (3)">
        <svg class="ico" viewBox="0 0 24 24"><path d="M4 18L9 5l11 4-3 10z" class="fill-soft"/></svg>
        <span>Faces</span>
      </button>
    </div>
    <div class="tool-sep" aria-hidden="true"></div>
    <button class="tool wall-only" type="button" data-edit-tool="window" title="Place a window: tap the wall">
      <svg class="ico" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="1"/><path d="M12 4v16M5 12h14"/></svg>
      <span>Window</span>
    </button>
    <button class="tool wall-only" type="button" data-edit-tool="door" title="Place a door: tap the wall">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 21V3.5h12V21"/><path d="M3.5 21h17"/><circle cx="15" cy="12.5" r="1" class="fill"/></svg>
      <span>Door</span>
    </button>
    <button class="tool floor-extra" type="button" data-edit-tool="solid" title="Draw a solid face">
      <svg class="ico" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5" class="fill-soft"/></svg>
      <span>Solid</span>
    </button>
    <button class="tool" type="button" data-edit-tool="void" title="Draw a void face (a hole or an indentation)">
      <svg class="ico" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5" stroke-dasharray="3 2.6"/></svg>
      <span>Void</span>
    </button>
    <button class="tool floor-extra" type="button" data-edit-tool="split" title="Split faces with a line">
      <svg class="ico" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5"/><path d="M8 21L16 3"/></svg>
      <span>Split</span>
    </button>
    <div class="tool-sep" aria-hidden="true"></div>
    <button id="edit-delete" class="tool danger" type="button" title="Delete the selection (Delete)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>
      <span>Delete</span>
    </button>
  </nav>

  <section id="edit-panel" hidden aria-label="Thickness">
    <div class="edit-panel-head">
      <span id="edit-panel-title">New faces</span>
      <span id="edit-panel-note" class="edit-panel-note"></span>
    </div>
    <div class="edit-row" id="edit-anchor-row" hidden>
      <div class="edit-row-line">
        <span class="edit-row-label">Anchor</span>
        <div class="seg small" id="edit-anchor" role="tablist" aria-label="Anchor the selected points">
          <button type="button" data-anchor="bottom" title="Measured from the wall base">Bottom</button>
          <button type="button" data-anchor="top" title="Follows the wall height">Top</button>
        </div>
      </div>
    </div>
    <div class="edit-row" id="edit-solid-row">
      <div class="edit-row-line">
        <span class="edit-row-label"><i class="swatch solid"></i>Thickness</span>
        <div class="stepper">
          <button type="button" data-edit-step="thickness" data-step="-1" aria-label="Thinner">−</button>
          <input id="edit-thickness" type="text" inputmode="decimal" aria-label="Thickness (m)" />
          <span class="unit">m</span>
          <button type="button" data-edit-step="thickness" data-step="1" aria-label="Thicker">+</button>
        </div>
      </div>
      <input id="edit-thickness-slider" class="edit-slider" type="range" min="0.05" max="1.00" step="0.01" aria-label="Thickness" />
    </div>
    <div class="edit-row" id="edit-void-row">
      <div class="edit-row-line">
        <span class="edit-row-label"><i class="swatch void"></i>Depth</span>
        <div class="stepper">
          <button type="button" data-edit-step="depth" data-step="-1" aria-label="Shallower">−</button>
          <input id="edit-depth" type="text" inputmode="decimal" aria-label="Void depth (m)" />
          <span class="unit">m</span>
          <button type="button" data-edit-step="depth" data-step="1" aria-label="Deeper">+</button>
        </div>
        <button id="edit-through" class="chip-toggle" type="button" aria-pressed="true" title="Cut all the way through">Through</button>
      </div>
      <input id="edit-depth-slider" class="edit-slider" type="range" min="0.02" max="1.00" step="0.01" aria-label="Depth" />
    </div>
  </section>

  <aside id="tree-panel" hidden aria-label="Model">
    <div class="tree-head">
      <h2>Model</h2>
      <button id="tree-close" class="icon-btn ghost" type="button" aria-label="Close the model tree">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <div id="tree-body" class="tree-body"></div>
  </aside>

  <div id="level-popover" class="popover" hidden role="listbox" aria-label="Levels"></div>

  <nav id="toolbar" aria-label="Tools">
    <button class="tool" type="button" data-tool="select" title="Select (V)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 3.5l13 6.2-5.6 1.7-2.2 5.8z"/><path d="M12.4 11.4l5.1 5.1"/></svg>
      <span>Select</span>
    </button>
    <button class="tool" type="button" data-tool="plate" title="Floor plate (F)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M2.5 10.5L12 5.5l9.5 5-9.5 5z"/><path d="M2.5 10.5v3l9.5 5 9.5-5v-3"/></svg>
      <span>Floor</span>
    </button>
    <button class="tool" type="button" data-tool="hole" title="Hole in a floor plate (H)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M2.5 10.5L12 5.5l9.5 5-9.5 5z"/><path d="M2.5 10.5v3l9.5 5 9.5-5v-3"/><path d="M9 10.4l3-1.6 3 1.6-3 1.6z" class="fill"/></svg>
      <span>Hole</span>
    </button>
    <button class="tool" type="button" data-tool="wall" title="Walls (W)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 20V9l5-3v11z"/><path d="M8 17l13-4V4L8 6"/><path d="M3 20l5-3"/></svg>
      <span>Wall</span>
    </button>
    <button class="tool" type="button" data-tool="window" title="Windows in a wall (N)">
      <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="1"/><path d="M12 3.5v17M4 12h16"/></svg>
      <span>Window</span>
    </button>
    <div class="tool-sep" aria-hidden="true"></div>
    <button id="snap-toggle" class="tool toggle" type="button" title="Snapping" aria-pressed="true">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0012 0V3"/><path d="M6 7h3.5M14.5 7H18"/></svg>
      <span>Snap</span>
    </button>
    <button id="fit-btn" class="tool" type="button" title="Zoom to fit (double-tap empty space)">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>Fit</span>
    </button>
  </nav>

  <div id="hint" class="hint" hidden></div>

  <section id="drawbar" hidden aria-label="Drawing">
    <div class="drawbar-row">
      <div class="seg small" id="shape-toggle" role="tablist" aria-label="Shape">
        <button type="button" data-shape="polygon" title="Polygon">
          <svg class="ico sm" viewBox="0 0 24 24"><path d="M5 18l-1-9 8-5 8 5-2 9z"/></svg>Polygon
        </button>
        <button type="button" data-shape="rect" title="Rectangle">
          <svg class="ico sm" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>Rectangle
        </button>
      </div>
      <button id="flip-toggle" class="chip-toggle" type="button" aria-pressed="false" title="Grow the wall thickness on the other side of the drawn line">
        <svg class="ico sm" viewBox="0 0 24 24"><path d="M7 4v16M17 4v16"/><path d="M10 9l-3-3-3 3M14 15l3 3 3-3"/></svg>
        <span>Flip side</span>
      </button>
      <button id="window-done" class="chip-toggle primary" type="button" title="Done with this wall (Esc)">
        <svg class="ico sm" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Done</span>
      </button>
      <label class="stepper" id="thickness-stepper" title="Thickness of new floor plates">
        <span class="stepper-label">Thick</span>
        <button type="button" data-step="-1" aria-label="Thinner">−</button>
        <input id="thickness-input" type="text" inputmode="decimal" value="0.30" aria-label="Thickness (m)" />
        <span class="unit">m</span>
        <button type="button" data-step="1" aria-label="Thicker">+</button>
      </label>
    </div>
    <div class="drawbar-row" id="wall-height-mode" hidden>
      <div class="seg small" id="wall-mode-toggle" role="tablist" aria-label="Wall height">
        <button type="button" data-wall-mode="fixed" title="A height you set">Fixed</button>
        <button type="button" data-wall-mode="upto" title="Up to a level or workplane">Up to</button>
      </div>
      <select id="wall-top-plane" class="plane-picker" aria-label="Wall top plane"></select>
      <label class="stepper" id="wall-top-offset-stepper" title="Offset from the top plane">
        <span class="stepper-label">Offset</span>
        <button type="button" data-top-offset="-1" aria-label="Lower">−</button>
        <input id="wall-top-offset" type="text" inputmode="decimal" value="0.00" aria-label="Top offset (m)" />
        <span class="unit">m</span>
        <button type="button" data-top-offset="1" aria-label="Higher">+</button>
      </label>
    </div>
    <div class="drawbar-row" id="wall-settings">
      <label class="stepper" id="wall-height-stepper" title="Height of new walls">
        <span class="stepper-label">Height</span>
        <button type="button" data-wall="height" data-step="-1" aria-label="Lower">−</button>
        <input id="wall-height-input" type="text" inputmode="decimal" value="2.70" aria-label="Wall height (m)" />
        <span class="unit">m</span>
        <button type="button" data-wall="height" data-step="1" aria-label="Higher">+</button>
      </label>
      <label class="stepper" title="Thickness of new walls">
        <span class="stepper-label">Thick</span>
        <button type="button" data-wall="thickness" data-step="-1" aria-label="Thinner">−</button>
        <input id="wall-thickness-input" type="text" inputmode="decimal" value="0.20" aria-label="Wall thickness (m)" />
        <span class="unit">m</span>
        <button type="button" data-wall="thickness" data-step="1" aria-label="Thicker">+</button>
      </label>
    </div>
    <div class="drawbar-row actions">
      <button id="undo-point" class="act" type="button" title="Undo last point (Backspace)">
        <svg class="ico sm" viewBox="0 0 24 24"><path d="M10 7L5 12l5 5"/><path d="M5 12h14"/></svg>
        <span>Undo point</span>
      </button>
      <button id="cancel-draw" class="act" type="button" title="Cancel (Esc)">
        <svg class="ico sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span>Cancel</span>
      </button>
      <button id="finish-draw" class="act primary" type="button" title="Finish (Enter)">
        <svg class="ico sm" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span>Finish</span>
      </button>
    </div>
    <div id="draw-reason" class="reason" aria-live="polite"></div>
  </section>

  <aside id="sheet" class="sheet" hidden aria-live="polite">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <button id="sheet-back" class="icon-btn ghost" type="button" aria-label="Back" hidden>
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="icon-btn ghost" type="button" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </aside>

  <div id="toasts" aria-live="polite"></div>

  <div id="dialog-backdrop" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title">
      <h3 id="dialog-title"></h3>
      <p id="dialog-message"></p>
      <div class="dialog-actions">
        <button id="dialog-cancel" type="button" class="btn">Cancel</button>
        <button id="dialog-ok" type="button" class="btn primary">OK</button>
      </div>
    </div>
  </div>

  <input type="file" id="import-input" accept=".vimd,application/octet-stream" hidden />

  <div id="loading">
    <div class="loading-card">
      <svg viewBox="0 0 32 32" width="44" height="44"><rect width="32" height="32" rx="8" fill="#2f6fed"/><path d="M6 15l10-6 10 6-10 6z" fill="#fff"/><path d="M6 19l10 6 10-6" fill="none" stroke="#fff" stroke-width="2"/></svg>
      <div class="loading-title">VIM Design</div>
      <div id="loading-status" class="loading-status">Loading…</div>
      <div class="loading-bar"><div></div></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
