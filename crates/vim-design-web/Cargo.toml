[package]
name = "vim-design-web"
description = "VimDesignWeb: WASM browser test app — wgpu demo scene + threading probe."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vim-design-lib = { workspace = true }
# 2D booleans for the rooms preview (effective regions).
i_overlay = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Performance",
    "console",
] }

# Renderer (wasm only; native builds of this crate stay lightweight).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "26", default-features = false, features = [
    "std",
    "webgpu", # browser WebGPU backend (preferred)
    "webgl",  # WebGL2 fallback for environments without WebGPU
    "wgsl",
] }
glam = "0.33"
wasm-bindgen-futures = "0.4"
serde_json = { workspace = true }

# Threaded configuration only (requires nightly + atomics; see README.md).
rayon = { workspace = true, optional = true }
wasm-bindgen-rayon = { workspace = true, features = ["no-bundler"], optional = true }

[features]
default = []
# Enable rayon-on-wasm. Build contract (enforced by devops/vbuild.ps1):
#   rustup toolchain: nightly (with rust-src)
#   RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals"
#   cargo build -Z build-std=std,panic_abort --target wasm32-unknown-unknown
threads = ["dep:rayon", "dep:wasm-bindgen-rayon", "vim-design-lib/parallel"]
