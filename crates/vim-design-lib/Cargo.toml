[package]
name = "vim-design-lib"
description = "VIM Design core library (parametric BREP building geometry). Skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
monstertruck-modeling = { workspace = true }
monstertruck-geometry = { workspace = true }
monstertruck-solid = { workspace = true }
monstertruck-meshing = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
# Dev/debug JSON export (docs/ARCHITECTURE.md §10); not part of wasm builds.
serde_json = { workspace = true, optional = true }

[features]
default = []
# Enables `Document::save_json` for diffing documents in tests.
json-debug = ["dep:serde_json"]

[dev-dependencies]
serde_json = { workspace = true }

[lints.clippy]
# "Never crash" contract — docs/ARCHITECTURE.md §8.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
