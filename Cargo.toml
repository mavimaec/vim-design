[workspace]
resolver = "3"
members = [
    "crates/vim-design-lib",
    "crates/vim-design-ffi",
    "crates/vim-design-web",
    "crates/vim-design-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
vim-design-lib = { path = "crates/vim-design-lib" }

# Geometry kernel (monstertruck family) — see docs/ARCHITECTURE.md §5.
monstertruck-modeling = "=0.4.0"
monstertruck-geometry = "=0.4.0"
monstertruck-solid = "=0.4.0"
monstertruck-meshing = "=0.4.0"

# Serialization (docs/ARCHITECTURE.md §10).
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde_json = "1"

# WASM / web.
# wasm-bindgen is pinned exactly so it always matches the wasm-bindgen-cli
# version installed by devops/vbuild.ps1.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-rayon = "1.3"
rayon = "1.10"
