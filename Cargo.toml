[workspace]
resolver = "3"
members = [
    "crates/vim-design-lib",
    "crates/vim-design-ffi",
    "crates/vim-design-web",
    "crates/vim-design-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
vim-design-lib = { path = "crates/vim-design-lib" }

# Geometry kernel (truck family) — see docs/ARCHITECTURE.md §5.
truck-modeling = "0.6.0"
truck-geometry = "0.5.0"
truck-shapeops = "0.4.0"
truck-meshalgo = "0.4.0"

# WASM / web.
# wasm-bindgen is pinned exactly so it always matches the wasm-bindgen-cli
# version installed by devops/vbuild.ps1.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
web-sys = "0.3"
wasm-bindgen-rayon = "1.3"
rayon = "1.10"
